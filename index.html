
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Personality Quiz</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="container py-5">
    <h1 class="text-center">What Type of College Student Are You?</h1>
    <p class="text-center">Answer four questions to find out!</p>

    <!-- Start quiz element -->
    <div class="question-block card p-4 mb-3" data-question="1">
      <h3>1. What do you do on Friday night?</h3>
      <button class="btn btn-outline-primary answer-btn" data-answer="academic">Study</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="social">Go out with friends</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="athlete">Play sports</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="procrastinator">Sleep and avoid homework</button>
    </div>

    <div class="question-block card p-4 mb-3" data-question="2">
      <h3>2. How do you prepare for an exam?</h3>
      <button class="btn btn-outline-primary answer-btn" data-answer="academic">Study days before</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="social">Study with friends</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="athlete">Study after practice</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="procrastinator">Cram at the last minute</button>
    </div>

    <div class="question-block card p-4 mb-3" data-question="3">
      <h3>3. What's your favorite part of college?</h3>
      <button class="btn btn-outline-primary answer-btn" data-answer="academic">Learning</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="social">Social events</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="athlete">Athletics</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="procrastinator">Free time</button>
    </div>

    <div class="question-block card p-4 mb-3" data-question="4">
      <h3>4. What do you do on a free Saturday?</h3>
      <button class="btn btn-outline-primary answer-btn" data-answer="academic">Get ahead on assignments</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="social">Hang out with friends</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="athlete">Work out or play sports</button>
      <button class="btn btn-outline-primary answer-btn" data-answer="procrastinator">Watch TV all day</button>
    </div>
    <!-- End quiz element -->

    <div class="text-center">
      <button id="show-result" class="btn btn-success btn-lg">Show Results</button>
    </div>

    <div id="result-container" class="card p-4 mt-4 text-center">
      <h3>Your Result:</h3>
      <p id="result-text">Complete the quiz to see your result!</p>
    </div>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
